<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Español Diario | 西語日常溝通</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --crema:#FBF6EC;
    --papel:#FFFDF8;
    --tinta:#241F18;
    --tinta-suave:#5C5344;
    --terracota:#C1501E;
    --terracota-suave:#EFD9C4;
    --verde:#3F6B52;
    --verde-suave:#DCE8DC;
    --linea:#DED0AA;
    --linea-forte:#C9BE9F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--crema);
    background-image:radial-gradient(circle at 1px 1px, rgba(36,31,24,0.05) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--tinta);
    font-family:'Inter',sans-serif;
    font-size:16px;
    line-height:1.65;
    -webkit-text-size-adjust:100%;
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px calc(60px + env(safe-area-inset-bottom));}
  .es-main, .ex-es, .pattern-template, .conj-main{font-family:'Inter',sans-serif;}

  /* ---- Header ---- */
  header{display:flex;align-items:center;gap:18px;margin-bottom:24px;}
  .sello{
    flex:none;width:56px;height:56px;
    background:var(--terracota);color:var(--papel);
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-style:italic;font-weight:700;font-size:28px;
    transform:rotate(-3deg);
    box-shadow:0 3px 0 rgba(36,31,24,.15);
  }
  h1{
    font-family:'Fraunces',serif;font-style:italic;font-weight:700;
    font-size:28px;margin:0;letter-spacing:.01em;color:var(--tinta);
  }
  header p{margin:3px 0 0;color:var(--tinta-suave);font-size:14.5px;}

  .beginner-banner{
    background:var(--verde-suave);color:var(--verde);border-radius:10px;
    padding:14px 16px;margin-bottom:22px;font-size:14px;line-height:1.6;
  }
  .beginner-banner b{color:var(--verde);}

  /* ---- Tabs ---- */
  nav.tabs{display:flex;border-bottom:1px solid var(--linea-forte);margin-bottom:20px;overflow-x:auto;}
  nav.tabs button{
    font-family:'Inter',sans-serif;background:none;border:none;
    padding:14px 18px;min-height:44px;
    font-size:15.5px;font-weight:600;color:var(--tinta-suave);
    cursor:pointer;position:relative;white-space:nowrap;
  }
  nav.tabs button.active{color:var(--tinta);}
  nav.tabs button.active::after{
    content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;
    background:var(--terracota);border-radius:2px 2px 0 0;
  }

  /* ---- Toolbar ---- */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;}
  .toolbar input[type=text]{
    flex:1 1 200px;padding:12px 14px;border:1px solid var(--linea-forte);border-radius:8px;
    background:var(--papel);font-family:inherit;font-size:16px;color:var(--tinta);min-height:44px;
  }
  .toolbar select{
    padding:12px 12px;border:1px solid var(--linea-forte);border-radius:8px;
    background:var(--papel);font-family:inherit;font-size:16px;color:var(--tinta);min-height:44px;
  }
  .toolbar label.chk{
    display:flex;align-items:center;gap:8px;font-size:14px;color:var(--tinta-suave);
    padding:10px;min-height:44px;
  }
  .toolbar input[type=checkbox]{accent-color:var(--terracota);width:20px;height:20px;}
  .count-badge{font-size:13px;color:var(--tinta-suave);margin-left:auto;padding:9px 2px;}

  section{display:none;}
  section.active{display:block;}

  /* ---- item cards ---- */
  .item-card{
    background:var(--papel);border:1px solid var(--linea);border-radius:10px;
    padding:16px 18px;margin-bottom:12px;
  }
  .item-top{display:flex;align-items:flex-start;gap:12px;}
  .item-main{flex:1;min-width:0;}
  .es-main{font-family:'Fraunces',serif;font-weight:600;font-size:21px;color:var(--tinta);}
  .ipa{font-size:13.5px;color:var(--terracota);margin-left:6px;font-family:'Inter',sans-serif;}
  .meaning{font-size:15px;margin-top:4px;color:var(--tinta);}
  .level-tag{
    font-size:12px;padding:3px 10px;border-radius:12px;background:var(--verde-suave);color:var(--verde);
    flex:none;align-self:flex-start;white-space:nowrap;
  }
  .known-check{
    flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;
    font-size:11.5px;color:var(--tinta-suave);min-height:44px;justify-content:center;
  }
  .known-check input{width:22px;height:22px;accent-color:var(--verde);}
  .example{
    margin-top:10px;padding-top:10px;border-top:1px dashed var(--linea-forte);
    font-size:13.5px;color:var(--tinta-suave);line-height:1.6;
  }
  .example .ex-es{color:var(--tinta);font-weight:600;font-size:14.5px;}

  .item-card.expandable{cursor:pointer;}
  .expand-body{margin-top:8px;font-size:15px;color:var(--tinta-suave);display:none;}
  .item-card.open .expand-body{display:block;}

  .empty-note{color:var(--tinta-suave);font-size:14px;padding:30px 0;text-align:center;}

  /* ---- grammar ---- */
  .g-title{font-size:19px;font-family:'Fraunces',serif;font-weight:600;color:var(--tinta);}
  .g-title .g-zh{font-size:13px;font-weight:700;color:var(--terracota);margin-left:8px;font-family:'Inter',sans-serif;}

  /* ---- pattern group ---- */
  .pattern-template{font-size:19px;font-family:'Fraunces',serif;font-weight:600;color:var(--tinta);}
  .pattern-meaning{font-size:14.5px;color:var(--terracota);font-weight:600;margin:3px 0 2px;}
  .pattern-note{font-size:13px;color:var(--tinta-suave);font-style:italic;margin-bottom:8px;}
  .pattern-examples{list-style:none;margin:8px 0 0;padding:0;}
  .pattern-examples li{
    font-size:14px;padding:8px 0;color:var(--tinta-suave);border-top:1px dashed var(--linea-forte);
  }
  .pattern-examples li:first-child{border-top:none;}
  .pattern-examples .ex-es{color:var(--tinta);font-weight:600;font-size:14.5px;}

  /* ---- substitution chips (單詞代換) ---- */
  .subs-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 4px;}
  .subs-label{font-size:12.5px;color:var(--tinta-suave);margin-right:2px;}
  .sub-chip{
    font-family:'Inter',sans-serif;font-size:13.5px;
    padding:7px 13px;border-radius:16px;min-height:34px;
    border:1px solid var(--terracota-suave);background:var(--papel);
    color:var(--terracota);cursor:pointer;
  }
  .sub-chip:hover,.sub-chip.active{background:var(--terracota);color:var(--papel);border-color:var(--terracota);}
  .sub-preview{
    display:none;align-items:center;gap:6px;flex-wrap:wrap;
    margin:6px 0 2px;padding:10px 12px;border-radius:8px;
    background:var(--crema);border:1px dashed var(--linea-forte);
    font-size:15px;color:var(--tinta);
  }
  .sub-preview.show{display:flex;}

  /* ---- verb conjugation ---- */
  .conj-block{margin-top:14px;}
  .conj-block h4{
    font-size:13px;letter-spacing:.02em;color:var(--terracota);
    border-bottom:2px solid var(--tinta);padding-bottom:5px;margin:0 0 4px;
  }
  table.conj{width:100%;border-collapse:collapse;}
  table.conj tr{border-bottom:1px solid var(--linea);}
  table.conj tr:last-child{border-bottom:none;}
  table.conj td{padding:10px 4px;font-size:15px;vertical-align:middle;}
  table.conj td.pron{color:var(--tinta-suave);font-size:13.5px;width:30%;}
  table.conj td.form{font-weight:600;}
  table.conj td.form .trans{font-weight:400;font-size:12.5px;color:var(--tinta-suave);margin-top:2px;}
  table.conj td.play{width:36px;text-align:right;}

  /* ---- Sound button ---- */
  .snd{
    display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:50%;
    border:1px solid var(--linea-forte);background:var(--crema);
    color:var(--tinta-suave);cursor:pointer;flex:none;
    vertical-align:middle;margin-left:6px;
    transition:background .15s,color .15s,border-color .15s;
  }
  .snd svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;}
  .snd:hover,.snd.playing{background:var(--terracota);border-color:var(--terracota);color:var(--papel);}
  .es-main .snd, .ex-es .snd, .pattern-template .snd{margin-left:8px;}

  footer{text-align:center;font-size:12px;color:var(--tinta-suave);margin-top:36px;}

  @media (max-width:520px){
    h1{font-size:24px;}
    .sello{width:48px;height:48px;font-size:24px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="sello">¡!</div>
    <div>
      <h1>Español Diario</h1>
      <p>詞彙・動詞變位・文法・句型 ｜ 拉美西語日常溝通</p>
    </div>
  </header>

  <div class="beginner-banner">
    <b>建議學習順序：</b>①發音規則(先熟悉字母怎麼唸)→②詞彙(高頻單字)→③動詞變位(現在式/過去式)→④文法→⑤句型。
    每張卡片都可以點喇叭聽拉美西語（es-MX）發音。
  </div>

  <nav class="tabs">
    <button data-tab="pron" class="active">發音規則</button>
    <button data-tab="vocab">詞彙</button>
    <button data-tab="verbs">動詞變位</button>
    <button data-tab="grammar">文法</button>
    <button data-tab="patterns">句型</button>
  </nav>

  <!-- PRONUNCIATION -->
  <section id="tab-pron" class="active">
    <div class="toolbar">
      <input type="text" id="pron-search" placeholder="搜尋字母 / 規則...">
      <select id="pron-category"><option value="all">全部類別</option></select>
      <span class="count-badge" id="pron-count"></span>
    </div>
    <div id="pron-list"></div>
  </section>

  <!-- VOCAB -->
  <section id="tab-vocab">
    <div class="toolbar">
      <input type="text" id="vocab-search" placeholder="搜尋詞彙 / 中文 / 例句...">
      <select id="vocab-category"><option value="all">全部分類</option></select>
      <label class="chk"><input type="checkbox" id="vocab-hide-known"> 隱藏已學</label>
      <span class="count-badge" id="vocab-count"></span>
    </div>
    <div id="vocab-list"></div>
  </section>

  <!-- VERBS -->
  <section id="tab-verbs">
    <div class="toolbar">
      <input type="text" id="verb-search" placeholder="搜尋動詞...">
      <label class="chk"><input type="checkbox" id="verb-hide-known"> 隱藏已學</label>
      <span class="count-badge" id="verb-count"></span>
    </div>
    <div id="verbs-list"></div>
  </section>

  <!-- GRAMMAR -->
  <section id="tab-grammar">
    <div class="toolbar">
      <input type="text" id="grammar-search" placeholder="搜尋文法點...">
      <label class="chk"><input type="checkbox" id="grammar-hide-known"> 隱藏已學</label>
      <span class="count-badge" id="grammar-count"></span>
    </div>
    <div id="grammar-list"></div>
  </section>

  <!-- PATTERNS -->
  <section id="tab-patterns">
    <div class="toolbar">
      <input type="text" id="pattern-search" placeholder="搜尋句型...">
      <label class="chk"><input type="checkbox" id="pattern-hide-known"> 隱藏已學</label>
      <span class="count-badge" id="pattern-count"></span>
    </div>
    <div id="patterns-list"></div>
  </section>

  <footer>拉美西語發音（es-MX）· 使用瀏覽器內建語音合成</footer>
</div>

<script>
/* =========================================================
   資料載入
   ========================================================= */
let VOCAB = [], VERBS = [], GRAMMAR = [], PATTERNS = [], PRON = [];

Promise.all([
  fetch('vocab.json').then(r=>r.json()),
  fetch('verbs.json').then(r=>r.json()),
  fetch('grammar.json').then(r=>r.json()),
  fetch('patterns.json').then(r=>r.json()),
  fetch('pronunciation.json').then(r=>r.json())
]).then(([v, vb, gr, pt, pr])=>{
  VOCAB = v.map((d,i)=>({...d, id:'vocab-'+i}));
  VERBS = vb.map((d,i)=>({...d, id:'verb-'+d.infinitivo}));
  GRAMMAR = gr.map((d,i)=>({...d, id:'grammar-'+i}));
  PATTERNS = pt.map((d,i)=>({...d, id:'pattern-'+i}));
  PRON = pr.map((d,i)=>({...d, id:'pron-'+i}));

  initVocabCategories();
  initPronCategories();
  renderPron();
  renderVocab();
  renderVerbs();
  renderGrammar();
  renderPatterns();
}).catch(err=>{
  document.getElementById('vocab-list').innerHTML = '<p style="color:#a33">資料載入失敗，請確認 json 檔案與 index.html 在同一層。</p>';
  console.error(err);
});

/* =========================================================
   語音朗讀 (Web Speech API, es-MX)
   ========================================================= */
const canSpeak = 'speechSynthesis' in window;
let esVoice = null;
function loadEsVoice(){
  if(!canSpeak) return;
  const voices = speechSynthesis.getVoices();
  esVoice = voices.find(v=>v.lang==='es-MX') || voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('es')) || null;
}
if(canSpeak){
  loadEsVoice();
  speechSynthesis.onvoiceschanged = loadEsVoice;
}
function speak(text, btn){
  if(!canSpeak){ alert('這個瀏覽器不支援語音朗讀功能'); return; }
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'es-MX';
  if(esVoice) utter.voice = esVoice;
  utter.rate = 0.95;
  if(btn){
    btn.classList.add('playing');
    utter.onend = ()=>btn.classList.remove('playing');
    utter.onerror = ()=>btn.classList.remove('playing');
  }
  speechSynthesis.speak(utter);
}
const SND_SVG = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a8.2 8.2 0 0 1 0 12"/></svg>';
function sndBtn(text){
  return `<span class="snd" data-say="${encodeURIComponent(text)}" title="播放發音">${SND_SVG}</span>`;
}
document.addEventListener('click', e=>{
  const btn = e.target.closest('.snd');
  if(!btn) return;
  e.stopPropagation();
  speak(decodeURIComponent(btn.dataset.say), btn);
});

/* =========================================================
   已學狀態 (localStorage)
   ========================================================= */
const KNOWN_KEY = 'es_app_known_v1';
let knownMap = JSON.parse(localStorage.getItem(KNOWN_KEY) || '{}');
function isKnown(id){ return !!knownMap[id]; }
function toggleKnown(id, val){
  knownMap[id] = val;
  localStorage.setItem(KNOWN_KEY, JSON.stringify(knownMap));
}

/* =========================================================
   Tabs
   ========================================================= */
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

/* =========================================================
   發音規則
   ========================================================= */
function initPronCategories(){
  const cats = [...new Set(PRON.map(p=>p.category))];
  const sel = document.getElementById('pron-category');
  cats.forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
}
function renderPron(){
  const q = document.getElementById('pron-search').value.trim().toLowerCase();
  const cat = document.getElementById('pron-category').value;
  const list = PRON.filter(p=>{
    if(cat!=='all' && p.category!==cat) return false;
    if(!q) return true;
    return (p.combo+p.note_zh+p.note_en+p.example_es).toLowerCase().includes(q);
  });
  document.getElementById('pron-count').textContent = list.length + ' / ' + PRON.length + ' 條規則';
  document.getElementById('pron-list').innerHTML = list.length ? list.map(p=>`
    <div class="item-card">
      <div class="item-top">
        <div class="item-main">
          <div class="es-main">${p.combo}${p.ipa && p.ipa!=='—' ? `<span class="ipa">/${p.ipa}/</span>` : ''}</div>
          <div class="meaning">${p.note_zh}</div>
          <div class="pattern-note" style="margin-top:2px;">${p.note_en}</div>
        </div>
        <div class="level-tag">${p.category}</div>
      </div>
      <div class="example"><span class="ex-es">${p.example_es}</span>${sndBtn(p.example_es)}<br>${p.example_zh} ／ ${p.example_en}</div>
    </div>`).join('') : `<div class="empty-note">沒有符合條件的規則</div>`;
}
document.getElementById('pron-search').addEventListener('input', renderPron);
document.getElementById('pron-category').addEventListener('change', renderPron);

/* =========================================================
   詞彙
   ========================================================= */
function initVocabCategories(){
  const cats = [...new Set(VOCAB.map(v=>v.category))];
  const sel = document.getElementById('vocab-category');
  cats.forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
}
function renderVocab(){
  const q = document.getElementById('vocab-search').value.trim().toLowerCase();
  const cat = document.getElementById('vocab-category').value;
  const hideKnown = document.getElementById('vocab-hide-known').checked;
  const list = VOCAB.filter(v=>{
    if(hideKnown && isKnown(v.id)) return false;
    if(cat!=='all' && v.category!==cat) return false;
    if(!q) return true;
    return (v.spanish+v.chinese+v.english+v.example_es+v.example_zh).toLowerCase().includes(q);
  });
  document.getElementById('vocab-count').textContent = list.length + ' / ' + VOCAB.length + ' 字';
  document.getElementById('vocab-list').innerHTML = list.length ? list.map(v=>`
    <div class="item-card">
      <div class="item-top">
        <div class="item-main">
          <div class="es-main">${v.spanish}<span class="ipa">/${v.ipa}/</span>${sndBtn(v.spanish)}</div>
          <div class="meaning">${v.chinese} · ${v.english}</div>
        </div>
        <div class="level-tag">${v.category}</div>
        <div class="known-check">
          <input type="checkbox" data-id="${v.id}" ${isKnown(v.id)?'checked':''}>已學
        </div>
      </div>
      <div class="example"><span class="ex-es">${v.example_es}</span>${sndBtn(v.example_es)}<br>${v.example_zh} ／ ${v.example_en}</div>
    </div>`).join('') : `<div class="empty-note">沒有符合條件的詞彙</div>`;
  document.getElementById('vocab-list').querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', e=>{ toggleKnown(e.target.dataset.id, e.target.checked); renderVocab(); });
  });
}
document.getElementById('vocab-search').addEventListener('input', renderVocab);
document.getElementById('vocab-category').addEventListener('change', renderVocab);
document.getElementById('vocab-hide-known').addEventListener('change', renderVocab);

/* =========================================================
   動詞變位
   ========================================================= */
const PERSONS = ["yo","tú","él/ella/usted","nosotros","ustedes","ellos/ellas"];
const SUBJ_ZH = ["我","你","他/她/您","我們","你們","他們/她們"];
const SUBJ_EN = ["I","you","he/she/you","we","you (all)","they"];
function thirdPersonS(verb){
  if(/[sxz]$|ch$|sh$/.test(verb)) return verb+'es';
  if(/[^aeiou]y$/.test(verb)) return verb.slice(0,-1)+'ies';
  return verb+'s';
}
function baseEn(ingles){ return ingles.replace(/^to\s+/, '').split('/')[0].trim(); }
function conjRows(forms, v, tense){
  const base = baseEn(v.ingles);
  return PERSONS.map((p,i)=>{
    const zh = SUBJ_ZH[i] + v.chino + (tense==='past' ? '了' : '');
    const enVerb = (tense==='present' && i===2) ? thirdPersonS(base) : base;
    const en = SUBJ_EN[i] + ' ' + enVerb + (tense==='past' ? ' (past)' : '');
    return `<tr>
      <td class="pron">${p}</td>
      <td class="form">${forms[i]}<div class="trans">${zh} · ${en}</div></td>
      <td class="play">${sndBtn(forms[i])}</td>
    </tr>`;
  }).join('');
}
function renderVerbs(){
  const q = document.getElementById('verb-search').value.trim().toLowerCase();
  const hideKnown = document.getElementById('verb-hide-known').checked;
  const list = VERBS.filter(v=>{
    if(hideKnown && isKnown(v.id)) return false;
    if(!q) return true;
    return (v.infinitivo+v.chino+v.ingles).toLowerCase().includes(q);
  });
  document.getElementById('verb-count').textContent = list.length + ' / ' + VERBS.length + ' 個';
  document.getElementById('verbs-list').innerHTML = list.length ? list.map(v=>{
    const presForms = [v.pres_yo, v.pres_tu, v.pres_el_ella_usted, v.pres_nosotros, v.pres_ustedes, v.pres_ellos];
    const pretForms = [v.pret_yo, v.pret_tu, v.pret_el_ella_usted, v.pret_nosotros, v.pret_ustedes, v.pret_ellos];
    return `
    <div class="item-card expandable" data-id="${v.id}">
      <div class="item-top">
        <div class="item-main">
          <div class="es-main">${v.infinitivo}${sndBtn(v.infinitivo)}</div>
          <div class="meaning">${v.chino} · ${v.ingles}</div>
        </div>
        <div class="level-tag">-${v.tipo}</div>
        <div class="known-check">
          <input type="checkbox" data-id="${v.id}" ${isKnown(v.id)?'checked':''} onclick="event.stopPropagation()">已學
        </div>
      </div>
      <div class="expand-body">
        <div class="conj-block">
          <h4>現在式 Presente</h4>
          <table class="conj">${conjRows(presForms, v, 'present')}</table>
        </div>
        <div class="conj-block">
          <h4>過去式 Pretérito</h4>
          <table class="conj">${conjRows(pretForms, v, 'past')}</table>
        </div>
        ${v.nota ? `<div class="pattern-note" style="margin-top:8px;">＊ ${v.nota}</div>` : ''}
      </div>
    </div>`;
  }).join('') : `<div class="empty-note">沒有符合條件的動詞</div>`;
  document.getElementById('verbs-list').querySelectorAll('.item-card').forEach(card=>{
    card.addEventListener('click', e=>{
      if(e.target.closest('.snd') || e.target.closest('.known-check')) return;
      card.classList.toggle('open');
    });
  });
  document.getElementById('verbs-list').querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', e=>{ toggleKnown(e.target.dataset.id, e.target.checked); renderVerbs(); });
  });
}
document.getElementById('verb-search').addEventListener('input', renderVerbs);
document.getElementById('verb-hide-known').addEventListener('change', renderVerbs);

/* =========================================================
   文法
   ========================================================= */
function renderGrammar(){
  const q = document.getElementById('grammar-search').value.trim().toLowerCase();
  const hideKnown = document.getElementById('grammar-hide-known').checked;
  const list = GRAMMAR.filter(g=>{
    if(hideKnown && isKnown(g.id)) return false;
    if(!q) return true;
    return (g.title_es+g.title_zh+g.zh+g.en+g.ex_es).toLowerCase().includes(q);
  });
  document.getElementById('grammar-count').textContent = list.length + ' / ' + GRAMMAR.length + ' 點';
  document.getElementById('grammar-list').innerHTML = list.length ? list.map(g=>`
    <div class="item-card expandable" data-id="${g.id}">
      <div class="item-top">
        <div class="item-main">
          <div class="g-title">${g.title_es}<span class="g-zh">${g.title_zh}</span></div>
        </div>
        <div class="known-check">
          <input type="checkbox" data-id="${g.id}" ${isKnown(g.id)?'checked':''} onclick="event.stopPropagation()">已學
        </div>
      </div>
      <div class="expand-body">
        <p style="margin:6px 0;">${g.zh}</p>
        <p style="margin:0 0 8px;color:var(--tinta-suave);font-style:italic;font-size:14px;">${g.en}</p>
        <div class="example"><span class="ex-es">${g.ex_es}</span>${sndBtn(g.ex_es)}<br>${g.ex_zh} ／ ${g.ex_en}</div>
      </div>
    </div>`).join('') : `<div class="empty-note">沒有符合條件的文法點</div>`;
  document.getElementById('grammar-list').querySelectorAll('.item-card').forEach(card=>{
    card.addEventListener('click', e=>{
      if(e.target.closest('.snd') || e.target.closest('.known-check')) return;
      card.classList.toggle('open');
    });
  });
  document.getElementById('grammar-list').querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', e=>{ toggleKnown(e.target.dataset.id, e.target.checked); renderGrammar(); });
  });
}
document.getElementById('grammar-search').addEventListener('input', renderGrammar);
document.getElementById('grammar-hide-known').addEventListener('change', renderGrammar);

/* =========================================================
   句型
   ========================================================= */
function renderPatterns(){
  const q = document.getElementById('pattern-search').value.trim().toLowerCase();
  const hideKnown = document.getElementById('pattern-hide-known').checked;
  const list = PATTERNS.filter(p=>{
    if(hideKnown && isKnown(p.id)) return false;
    if(!q) return true;
    const hay = (p.pattern_es+p.pattern_zh+p.note+p.examples.map(e=>e.es+e.zh+e.en).join('')).toLowerCase();
    return hay.includes(q);
  });
  document.getElementById('pattern-count').textContent = list.length + ' / ' + PATTERNS.length + ' 句型';
  document.getElementById('patterns-list').innerHTML = list.length ? list.map(p=>`
    <div class="item-card">
      <div class="item-top">
        <div class="item-main">
          <div class="pattern-template">${p.pattern_es}${sndBtn(p.pattern_es)}</div>
          <div class="pattern-meaning">${p.pattern_zh}</div>
          <div class="pattern-note">${p.note}</div>
        </div>
        <div class="known-check">
          <input type="checkbox" data-id="${p.id}" ${isKnown(p.id)?'checked':''}>已學
        </div>
      </div>
      ${subsBlock(p.template, p.subs)}
      <ul class="pattern-examples">
        ${p.examples.map(e=>`<li><span class="ex-es">${e.es}</span>${sndBtn(e.es)}<br>${e.zh} ／ ${e.en}</li>`).join('')}
      </ul>
    </div>`).join('') : `<div class="empty-note">沒有符合條件的句型</div>`;
  document.getElementById('patterns-list').querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', e=>{ toggleKnown(e.target.dataset.id, e.target.checked); renderPatterns(); });
  });
}
document.getElementById('pattern-search').addEventListener('input', renderPatterns);
document.getElementById('pattern-hide-known').addEventListener('change', renderPatterns);

/* ---- 單詞代換 (subsBlock) ---- */
function subsBlock(template, subs){
  if(!subs || !subs.length) return '';
  return `
    <div class="subs-row" data-template="${encodeURIComponent(template)}">
      <span class="subs-label">套用看看：</span>
      ${subs.map(w=>`<button class="sub-chip" type="button" data-word="${encodeURIComponent(w)}">${w}</button>`).join('')}
    </div>
    <div class="sub-preview"></div>`;
}
document.addEventListener('click', e=>{
  const chip = e.target.closest('.sub-chip');
  if(!chip) return;
  e.stopPropagation();
  const row = chip.closest('.subs-row');
  const preview = row.nextElementSibling;
  if(!preview || !preview.classList.contains('sub-preview')) return;
  const template = decodeURIComponent(row.dataset.template);
  const word = decodeURIComponent(chip.dataset.word);
  const sentence = template.replace('〜', word);
  row.querySelectorAll('.sub-chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  preview.classList.add('show');
  preview.innerHTML = `<span>${sentence}</span>${sndBtn(sentence)}`;
});
</script>
